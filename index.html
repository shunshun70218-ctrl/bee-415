<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>秀朗 415 小蜜蜂大進擊！· Galaga v1</title>
<style>
  :root {
    --space-deep: #0b1138;
    --space-mid:  #1a2266;
    --space-up:   #2e3aa0;
    --accent: #ff9c1c;
    --bee-yellow: #ffd400;
    --bullet: #fff;
    --hp: #ff4d6d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
    background: linear-gradient(180deg, #88d8ff 0%, #c7eaff 35%, #b9e08c 60%, #6cae4f 100%);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem 1rem 2rem;
    color: #2a2a2a;
    user-select: none;
  }
  h1 {
    margin: 0.3rem 0 0.1rem;
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
  }
  .subtitle { color: #2a4a1a; font-size: 0.85rem; margin-bottom: 0.8rem; opacity: 0.85; text-align:center; }

  .hud {
    display: flex;
    gap: 0.7rem;
    margin-bottom: 0.8rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .hud .chip {
    background: white;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .chip .label { color: #6e7681; font-weight: 600; font-size: 0.8rem; }
  .chip .val { color: #d04317; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .chip.time .val { color: #2da44e; }
  .chip.best .val { color: #8957e5; }
  .chip.hp   .val { color: #cf222e; }
  .chip.who .val { color: #1f6feb; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 0.3rem; }
  .chip-photo {
    width: 26px; height: 26px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
    vertical-align: middle;
  }
  .end-photo {
    width: 72px; height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--accent);
    margin: 0.3rem auto 0.4rem;
    display: block;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .diff-row-main {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
    margin: 0 0 0.7rem;
    align-items: center;
  }
  .diff-row-main .diff-row-label {
    font-size: 0.78rem; color: #2a4a1a; font-weight: 700;
    background: white; padding: 0.35rem 0.7rem; border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
  }

  /* 遊戲畫布 */
  .stage {
    width: min(480px, 94vw);
    aspect-ratio: 3 / 4;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    background: radial-gradient(ellipse at 50% 0%, var(--space-up) 0%, var(--space-mid) 45%, var(--space-deep) 100%);
    box-shadow: 0 14px 36px rgba(0,0,0,0.25), inset 0 0 0 3px #303a8e;
    touch-action: none;
  }
  .stage canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .play-hint {
    margin-top: 0.6rem;
    color: #2a4a1a;
    font-size: 0.82rem;
    text-align: center;
    opacity: 0.85;
    background: rgba(255,255,255,0.7);
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    position: relative;
    z-index: 1;
  }
  .stage.paused::after {
    content: '⏸ 按 ▶️ 開始遊戲';
    position: absolute; inset: 0;
    color: white; font-weight: 800; font-size: 1.1rem;
    display:flex; align-items:center; justify-content:center;
    background: rgba(10,15,40,0.45);
    pointer-events: none;
    z-index: 4;
  }

  .controls {
    display: flex;
    gap: 0.7rem;
    margin-top: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.65rem 1.4rem;
    border-radius: 999px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 4px 0 #c47215;
    transition: transform .1s, box-shadow .1s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #c47215; }
  button.secondary {
    background: white;
    color: #2a4a1a;
    box-shadow: 0 4px 0 #b3c5a0;
  }
  button.secondary:active { box-shadow: 0 2px 0 #b3c5a0; }
  .link-btn {
    background: white;
    color: #2a4a1a;
    padding: 0.65rem 1.4rem;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 4px 0 #b3c5a0;
    transition: transform .1s, box-shadow .1s;
    display: inline-flex;
    align-items: center;
  }
  .link-btn:hover { transform: translateY(-1px); }
  .link-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b3c5a0; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 30, 40, 0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1rem;
  }
  .overlay.hidden { display: none; }
  .card {
    background: white;
    border-radius: 18px;
    padding: 1.8rem 2rem;
    max-width: 90vw;
    width: 380px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  }
  .card h2 { margin: 0 0 0.6rem; font-size: 1.6rem; }
  .card .big {
    font-size: 3rem;
    font-weight: 900;
    color: var(--accent);
    margin: 0.4rem 0;
    line-height: 1;
  }
  .card .row { color: #57606a; margin: 0.4rem 0; font-size: 0.95rem; }
  .card button { margin-top: 1rem; }
  .new-best { color: #d62828; font-weight: 800; }

  .gate-input {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 1.2rem;
    border: 2px solid #d0d7de;
    border-radius: 12px;
    margin: 0.3rem 0;
    text-align: center;
    font-family: inherit;
    background: #fafbfc;
    transition: border-color .15s, background .15s;
    font-variant-numeric: tabular-nums;
  }
  .gate-input:focus { outline: none; border-color: var(--accent); background: white; }
  .gate-hint {
    text-align: left;
    font-size: 0.8rem;
    color: #6e7681;
    margin: 0.5rem 0 0.15rem;
    font-weight: 600;
  }
  .gate-err {
    color: #cf222e;
    font-size: 0.85rem;
    margin: 0.4rem 0 0;
    min-height: 1.2em;
  }
  .gate-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-top: 0.6rem;
  }
  .gate-actions button { margin-top: 0; }

  .diff-row {
    display: flex;
    gap: 0.4rem;
    justify-content: center;
    flex-wrap: wrap;
    margin: 0.2rem 0 0.4rem;
  }
  .diff-btn {
    background: #f0f0f0;
    color: #57606a;
    border: 2px solid #d8dde3;
    border-radius: 999px;
    padding: 0.4rem 0.95rem;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: none;
    margin-top: 0;
    transition: all .12s;
  }
  .diff-btn:hover { transform: none; background: #e8e8e8; }
  .diff-btn:active { transform: none; box-shadow: none; }
  .diff-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    box-shadow: 0 3px 0 #c47215;
  }
  .chip.diff .val { color: #0969da; font-size: 0.9rem; }

  .upload-status {
    font-size: 0.82rem;
    color: #6e7681;
    margin: 0.3rem 0;
    min-height: 1.2em;
  }
  .upload-status.ok { color: #2da44e; }
  .upload-status.err { color: #cf222e; }
  .end-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 0.6rem;
  }
  .end-actions button, .end-actions .link-btn { margin-top: 0; }

  footer { margin-top: 1rem; color: #2a4a1a; font-size: 0.8rem; text-align: center; opacity: 0.8; }

  .decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .decor svg { position: absolute; }
  body > h1, body > .subtitle, body > .hud, body > .stage, body > .diff-row-main, body > .controls, body > footer {
    position: relative;
    z-index: 1;
  }

  .sun {
    top: 14px;
    right: 18px;
    width: clamp(60px, 9vw, 84px);
    height: clamp(60px, 9vw, 84px);
    animation: sun-spin 24s linear infinite;
    filter: drop-shadow(0 4px 10px rgba(255,180,30,0.45));
  }
  @keyframes sun-spin { to { transform: rotate(360deg); } }

  .cloud { opacity: 0.95; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.08)); }
  .cloud-1 {
    top: 80px; left: 4%;
    width: clamp(90px, 14vw, 140px);
    animation: cloud-drift-1 24s ease-in-out infinite;
  }
  .cloud-2 {
    top: 170px; right: 6%;
    width: clamp(70px, 11vw, 110px);
    animation: cloud-drift-2 30s ease-in-out infinite;
  }
  @keyframes cloud-drift-1 {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(30px); }
  }
  @keyframes cloud-drift-2 {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(-26px); }
  }

  .butterfly {
    width: 46px; height: 46px;
    top: 50%; left: 8%;
    animation: butterfly-fly 16s ease-in-out infinite;
    transform-origin: 50% 50%;
  }
  .butterfly .wing {
    transform-origin: 23px 23px;
    animation: butterfly-flap 0.32s ease-in-out infinite alternate;
  }
  .butterfly .wing.right { animation-delay: 0s; }
  .butterfly .wing.left  { transform: scaleX(-1); transform-origin: 23px 23px; }
  @keyframes butterfly-flap {
    from { transform: scaleX(1) rotateY(0deg); }
    to   { transform: scaleX(1) rotateY(60deg); }
  }
  @keyframes butterfly-fly {
    0%   { transform: translate(0, 0) rotate(-8deg); }
    25%  { transform: translate(40px, -30px) rotate(6deg); }
    50%  { transform: translate(120px, 10px) rotate(-4deg); }
    75%  { transform: translate(50px, 50px) rotate(8deg); }
    100% { transform: translate(0, 0) rotate(-8deg); }
  }

  @media (max-width: 480px) {
    .sun { width: 56px; height: 56px; top: 8px; right: 8px; }
    .cloud-1 { top: 60px; width: 80px; }
    .cloud-2 { top: 130px; width: 64px; }
    .butterfly { width: 36px; height: 36px; }
    h1 { font-size: 1.3rem; }
    .controls button, .controls .link-btn { padding: 0.55rem 1rem; font-size: 0.9rem; }
    .card { padding: 1.4rem 1.4rem; }
    .card .big { font-size: 2.4rem; }
  }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import { firebaseConfig, SCORES_COLLECTION } from "./firebase-config.js";
import { photoForStudent } from "./students.js";

// === Firebase init ===
let db = null;
let firebaseReady = false;
try {
  if (firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("PASTE_")) {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    firebaseReady = true;
  }
} catch (e) {
  console.warn("Firebase init failed:", e);
}

// === Emoji 頭像（依學號 hash 決定，用於排行榜識別）===
const EMOJI_POOL = ['🐹','🐰','🐻','🐼','🐨','🐯','🦁','🐸','🐵','🦊','🐺','🐮','🐷','🐶','🐱','🦝','🐭','🦥','🦦','🐢','🦔','🐧','🦄','🦓','🦒','🐔','🐤','🦉','🐙','🦋','🐝','🐳'];
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function pickEmoji(studentId) {
  if (!studentId) return '🎯';
  return EMOJI_POOL[hashStr(studentId) % EMOJI_POOL.length];
}

const $ = id => document.getElementById(id);

// === 三段難度設定（v2：大幅調難）===
// beeFireChance：每蜂每幀開火機率
// formationBase / formationPerWave：編隊水平速度（隨關數加速）
// maxDivers：同時最多幾隻俯衝
// diveVy：俯衝速度
// volley：每次發射敵彈顆數（1=單發, 3=三連發扇形）

  normal: { label: '🙂 普通', diveChance: 0.0075, beeBulletSpeed: 3.8, beeFireChance: 0.0065, playerCool: 200, rows: 5, formationBase: 1.05, formationPerWave: 0.16, maxDivers: 3, diveVy: 0.26, volley: 1 },
  hard:   { label: '😈 困難', diveChance: 0.014,  beeBulletSpeed: 5.0, beeFireChance: 0.013,  playerCool: 230, rows: 5, formationBase: 1.55, formationPerWave: 0.24, maxDivers: 6, diveVy: 0.34, volley: 3 },

// ====================== 遊戲核心 ======================
const CV = $('cv');
const ctx = CV.getContext('2d');
const W = CV.width, H = CV.height;

// ===== 關卡制 =====
// 第 1~13 關：boss 是 face-02 ~ face-14（13 位同學）
// 第 14 關：老師大魔王（face-01）
// 第 15+ 關：循環，但每輪敵人更兇
const BOSS_ROTATION = [
  'face-02.jpg','face-03.jpg','face-04.jpg','face-05.jpg','face-06.jpg','face-07.jpg','face-08.jpg',
  'face-09.jpg','face-10.jpg','face-11.jpg','face-12.jpg','face-13.jpg','face-14.jpg',
  'face-01.jpg',
];
function bossFaceForLevel(L) {
  return BOSS_ROTATION[(L - 1) % BOSS_ROTATION.length];
}
function isTeacherLevel(L) {
  return ((L - 1) % BOSS_ROTATION.length) === 13; // 第 14 關、28、42…
}
// 每一關依等級套乘的參數
function levelParams(L) {
  const tier = L - 1;
  return {
    speedMul:      1 + tier * 0.10,
    diveMul:       1 + tier * 0.12,
    fireMul:       1 + tier * 0.10,
    bulletAdd:     tier * 0.18,
    maxDiversAdd:  Math.floor(tier / 2),
    diveVyAdd:     tier * 0.012,
    rows:          Math.min(5, 3 + Math.floor(tier / 2)),
    cols:          8,
    volleyAdd:     L >= 5 ? 1 : 0,
    specialCount:  Math.min(6, 2 + Math.floor(tier / 2)),
    bossHp:        isTeacherLevel(L) ? (20 + Math.floor(tier / 14) * 10) : (5 + Math.floor(tier / 4)),
    bossSize:      isTeacherLevel(L) ? 2.4 : 1.6,
    bossBonus:     isTeacherLevel(L) ? 200 : 30,
  };
}
let LP = levelParams(1);
let levelTransitionUntil = 0;
let transitionText = '';

// 玩家頭像（顯示在飛機駕駛艙）
const playerFaceImg = new Image();
let playerFaceLoaded = false;
function setPlayerFaceSrc() {
  if (!player) { playerFaceLoaded = false; return; }
  const src = photoForStudent(player.studentId) || 'face-default.svg';
  playerFaceLoaded = false;
  playerFaceImg.onload = () => { playerFaceLoaded = true; };
  playerFaceImg.onerror = () => { playerFaceLoaded = false; };
  playerFaceImg.src = src;
}

// 小美女蜂（特殊敵人）使用 14 張學號照片
const FACES = [
  'face-01.jpg','face-02.jpg','face-03.jpg','face-04.jpg','face-05.jpg','face-06.jpg','face-07.jpg',
  'face-08.jpg','face-09.jpg','face-10.jpg','face-11.jpg','face-12.jpg','face-13.jpg','face-14.jpg',
];
const faceImgs = {};
let faceBag = [];
function preloadFaces() {
  FACES.forEach(f => {
    if (faceImgs[f]) return;
    const img = new Image();
    img.src = f;
    faceImgs[f] = img;
  });
}
function nextFace() {
  if (faceBag.length === 0) {
    faceBag = FACES.slice();
    for (let i = faceBag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [faceBag[i], faceBag[j]] = [faceBag[j], faceBag[i]];
    }
  }
  return faceBag.shift();
}

// 狀態
let score = 0, combo = 0, hp = 3;
let best = +(localStorage.getItem('bee_best') || 0);
let running = false;
let lastT = 0;
let soundOn = true, musicOn = true;
let bgmTimer = null, bgmIndex = 0;
$('best').textContent = best;
$('hp').textContent = '❤❤❤';

// 物件
let bees = [];        // {x,y,col,row,baseX,baseY, state:'formation'|'diving', vx,vy, face?, hp, isBoss, size, alive}
let bullets = [];     // {x,y,vy} from player
let enemyBullets = [];// {x,y,vy,vx}
let particles = [];   // explosion bits
let playerObj = { x: W/2, y: H - 64, w: 44, h: 44, cool: 0 };
let formation = { dir: 1, speed: 0, descend: 0 };
let level = 1;

// 輸入
const keys = { left: false, right: false, fire: false };
let touchPointerX = null;

addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight'|| e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === ' ' || e.key === 'Spacebar') { keys.fire = true; e.preventDefault(); }
});
addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight'|| e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === ' ' || e.key === 'Spacebar') keys.fire = false;
});

const stage = $('stage');
function stageCoordsFromEvent(e) {
  const rect = CV.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * W;
  return x;
}
stage.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  touchPointerX = stageCoordsFromEvent(e);
  keys.fire = true;
  stage.setPointerCapture?.(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (touchPointerX != null) touchPointerX = stageCoordsFromEvent(e);
});
stage.addEventListener('pointerup', (e) => {
  touchPointerX = null;
  keys.fire = false;
});
stage.addEventListener('pointercancel', () => {
  touchPointerX = null;
  keys.fire = false;
});

// 音效
let audioCtx = null;
function beep(freq, duration = 0.06, type = 'square', vol = 0.18) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// 8-bit BGM (改太空感的小調)
const BGM_MELODY = [
  392.00, 523.25, 659.25, 783.99, 659.25, 523.25, 392.00, 523.25,
  349.23, 466.16, 587.33, 698.46, 587.33, 466.16, 349.23, 466.16,
  329.63, 415.30, 523.25, 659.25, 523.25, 415.30, 329.63, 415.30,
  392.00, 523.25, 659.25, 783.99, 659.25, 523.25, 392.00, 523.25,
];
const BGM_BASS = [98.00, 130.81, 87.31, 110.00];
function bgmTone(freq, duration, type, vol) {
  if (!musicOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}
function bgmStep() {
  if (!musicOn || !running) { bgmTimer = null; return; }
  bgmTone(BGM_MELODY[bgmIndex], 0.18, 'triangle', 0.05);
  if (bgmIndex % 8 === 0) bgmTone(BGM_BASS[(bgmIndex / 8) | 0], 0.55, 'sawtooth', 0.04);
  bgmIndex = (bgmIndex + 1) % BGM_MELODY.length;
  const tempo = isTeacherLevel(level) ? 130 : (level >= 8 ? 170 : 220);
  bgmTimer = setTimeout(bgmStep, tempo);
}
function startBgm() { stopBgm(); bgmIndex = 0; bgmStep(); }
function stopBgm() { if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; } }

// ===== 編隊產生 =====
function spawnLevel() {
  LP = levelParams(level);
  bees = [];
  bullets = []; enemyBullets = [];
  const cols = LP.cols;
  const rows = LP.rows;
  const spacingX = 46;
  const spacingY = 40;
  const startX = (W - (cols - 1) * spacingX) / 2;
  const startY = 90; // 留出上方空間給 BOSS
  const specialCount = LP.specialCount;
  const specialIdxSet = new Set();
  while (specialIdxSet.size < specialCount) {
    specialIdxSet.add(Math.floor(Math.random() * cols * rows));
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      const isSpecial = specialIdxSet.has(idx);
      bees.push({
        col: c, row: r,
        baseX: startX + c * spacingX,
        baseY: startY + r * spacingY,
        x: startX + c * spacingX,
        y: startY + r * spacingY,
        w: 30, h: 28,
        state: 'formation',
        vx: 0, vy: 0,
        diveT: 0,
        face: isSpecial ? nextFace() : null,
        hp: 1,
        isBoss: false,
        size: 1,
        alive: true,
      });
    }
  }
  // ===== BOSS 蜜蜂 =====
  const bossFace = bossFaceForLevel(level);
  const bossSize = LP.bossSize;
  const baseR = 14 * bossSize;
  bees.push({
    col: -1, row: -1,
    baseX: W / 2,
    baseY: 40,
    x: W / 2,
    y: 40,
    w: baseR * 2, h: baseR * 2,
    state: 'formation',
    vx: 0, vy: 0,
    diveT: 0,
    face: bossFace,
    hp: LP.bossHp,
    hpMax: LP.bossHp,
    isBoss: true,
    isTeacher: isTeacherLevel(level),
    size: bossSize,
    alive: true,
  });

  formation.dir = 1;
  formation.descend = 0;
  formation.speed = D.formationBase * LP.speedMul;

  // 關卡介紹動畫
  transitionText = isTeacherLevel(level)
    ? `👹 LEVEL ${level}\n老師大魔王 來了！`
    : `🚀 STAGE ${level}`;
  levelTransitionUntil = performance.now() + 1800;
}

// ===== 主迴圈 =====
function tick(t) {
  if (!running) return;
  const dt = Math.min(48, t - (lastT || t));
  lastT = t;
  update(dt);
  render();
  requestAnimationFrame(tick);
}

function update(dt) {
  // 玩家移動
  const moveSpd = 0.45;
  if (touchPointerX != null) {
    const tx = Math.max(playerObj.w/2, Math.min(W - playerObj.w/2, touchPointerX));
    const diff = tx - playerObj.x;
    playerObj.x += Math.sign(diff) * Math.min(Math.abs(diff), moveSpd * dt);
  } else {
    if (keys.left)  playerObj.x -= moveSpd * dt;
    if (keys.right) playerObj.x += moveSpd * dt;
  }
  playerObj.x = Math.max(playerObj.w/2, Math.min(W - playerObj.w/2, playerObj.x));

  // 關卡介紹中：只動玩家、暫停敵人 AI
  const inTransition = performance.now() < levelTransitionUntil;

  // 射擊
  playerObj.cool -= dt;
  if (!inTransition && keys.fire && playerObj.cool <= 0) {
    bullets.push({ x: playerObj.x - 2, y: playerObj.y - 18, w: 4, h: 12, vy: -0.9 });
    bullets.push({ x: playerObj.x + 2 - 4, y: playerObj.y - 18, w: 4, h: 12, vy: -0.9 });
    beep(1100, 0.04, 'square', 0.12);
    playerObj.cool = D.playerCool;
  }

  // 玩家子彈
  for (const b of bullets) b.y += b.vy * dt;
  bullets = bullets.filter(b => b.y > -20);

  // 蜜蜂編隊水平移動
  let needDescend = false;
  let divingCount = 0;
  for (const bee of bees) if (bee.alive && bee.state === 'diving') divingCount++;
  const maxDivers = D.maxDivers + LP.maxDiversAdd;
  const diveChance = D.diveChance * LP.diveMul;
  const fireChance = D.beeFireChance * LP.fireMul;
  const diveVyBase = D.diveVy + LP.diveVyAdd;
  for (const bee of bees) {
    if (!bee.alive) continue;
    // boss 不俯衝（會在原地左右晃，但會頻繁開火）
    if (bee.isBoss) {
      // 慢慢左右移動（拉低 y 讓 HP 條跟皇冠都看得到）
      bee.x = W/2 + Math.sin(performance.now() / (bee.isTeacher ? 700 : 900)) * (W * 0.32);
      bee.y = 70 + Math.cos(performance.now() / 1300) * 10;
      if (!inTransition && Math.random() < fireChance * (bee.isTeacher ? 3.5 : 2.0) * (dt/16)) {
        // boss 開火：往玩家方向
        const dx = playerObj.x - bee.x, dy = playerObj.y - bee.y;
        const len = Math.max(1, Math.hypot(dx, dy));
        const sp = D.beeBulletSpeed + LP.bulletAdd;
        if (bee.isTeacher) {
          // 老師大魔王：扇形 5 連發
          for (let i = -2; i <= 2; i++) {
            enemyBullets.push({ x: bee.x, y: bee.y + 20, w: 4, h: 10, vy: sp * 0.5, vx: i * 0.06 });
          }
        } else {
          enemyBullets.push({ x: bee.x, y: bee.y + 20, w: 4, h: 10, vy: sp * 0.5 * (dy/len + 0.6), vx: (dx/len) * 0.05 });
        }
      }
      continue;
    }
    if (inTransition) continue; // 過場時敵人凍結
    if (bee.state === 'formation') {
      bee.baseX += formation.dir * formation.speed * (dt/16);
      bee.x = bee.baseX;
      bee.y = bee.baseY + formation.descend;
      if (bee.x < 20 || bee.x > W - 20) needDescend = true;
      if (divingCount < maxDivers && Math.random() < diveChance * (dt/16)) {
        bee.state = 'diving';
        bee.vx = (playerObj.x - bee.x) / 220;
        bee.vy = diveVyBase * (0.85 + Math.random() * 0.3);
        bee.diveT = 0;
        divingCount++;
      }
      if (Math.random() < fireChance * 0.35 * (dt/16)) {
        fireEnemyBullet(bee.x, bee.y + 12);
      }
    } else if (bee.state === 'diving') {
      bee.diveT += dt;
      bee.x += bee.vx * dt;
      bee.y += bee.vy * dt;
      bee.vy += 0.0010 * dt;
      if (Math.random() < fireChance * (dt/16) && bee.y < H - 80) {
        fireEnemyBullet(bee.x, bee.y + 16);
      }
      if (bee.y > H + 30) {
        bee.state = 'formation';
        bee.y = -20;
        bee.x = bee.baseX;
      }
    }
  }
  if (needDescend) {
    formation.dir *= -1;
    formation.descend = Math.min(formation.descend + 8, 220); // 防止編隊下沉到玩家下方
  }

  // 敵彈
  for (const b of enemyBullets) {
    b.y += b.vy * (dt/16);
    if (b.vx) b.x += b.vx * dt;
  }
  enemyBullets = enemyBullets.filter(b => b.y < H + 20 && b.x > -10 && b.x < W + 10);

  // 玩家子彈 vs 蜜蜂
  for (const bul of bullets) {
    for (const bee of bees) {
      if (!bee.alive) continue;
      const r = (bee.w/2) * (bee.isBoss ? 0.85 : 1);
      if (Math.abs(bul.x - bee.x) < r && Math.abs(bul.y - bee.y) < r) {
        bul.y = -100;
        bee.hp -= 1;
        if (bee.hp > 0) {
          // boss 還活著，扣血、小爆閃
          spawnParticles(bee.x, bee.y, '#fff', 6);
          beep(440, 0.04, 'square', 0.1);
          break;
        }
        // 死亡
        bee.alive = false;
        let gain;
        if (bee.isBoss) gain = LP.bossBonus;
        else if (bee.face) gain = 5;
        else gain = 1;
        combo++;
        const bonus = combo >= 5 ? 2 : 1;
        const total = bee.isBoss ? gain : gain * bonus;
        score += total;
        $('score').textContent = score;
        $('combo').textContent = combo;
        const color = bee.isBoss ? (bee.isTeacher ? '#ffd400' : '#ff9ec7') : (bee.face ? '#ff9ec7' : '#ffd400');
        spawnParticles(bee.x, bee.y, color, bee.isBoss ? 50 : 14);
        beep(bee.isBoss ? 220 : (bee.face ? 880 : 660), 0.12, 'square', 0.22);
        if (bee.isBoss) {
          setTimeout(() => beep(440, 0.18, 'triangle', 0.2), 80);
          setTimeout(() => beep(880, 0.22, 'sine', 0.2), 220);
        }
        if (bonus > 1 && !bee.isBoss) setTimeout(() => beep(1320, 0.04, 'triangle', 0.16), 50);
        break;
      }
    }
  }
  bees = bees.filter(b => b.alive);
  if (bees.length === 0) {
    nextLevel();
  }

  // 敵彈 vs 玩家
  for (const b of enemyBullets) {
    if (Math.abs(b.x - playerObj.x) < playerObj.w/2 - 4 &&
        Math.abs(b.y - playerObj.y) < playerObj.h/2 - 4) {
      b.y = H + 100;
      hitPlayer();
    }
  }
  // 蜜蜂俯衝撞玩家
  for (const bee of bees) {
    if (bee.state !== 'diving') continue;
    if (Math.abs(bee.x - playerObj.x) < playerObj.w/2 &&
        Math.abs(bee.y - playerObj.y) < playerObj.h/2) {
      bee.alive = false;
      spawnParticles(bee.x, bee.y, '#ff4d6d', 18);
      hitPlayer();
    }
  }

  // 粒子
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 0.0006 * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  // 防呆：每幀檢查還有沒有活著的蜜蜂；若一隻都沒了，直接晉級
  if (running && bees.filter(b => b.alive).length === 0) {
    nextLevel();
  }
}

function fireEnemyBullet(x, y) {
  const totalVolley = D.volley + LP.volleyAdd;
  const vyBase = (D.beeBulletSpeed + LP.bulletAdd) * 0.5;
  if (totalVolley >= 3) {
    for (let i = -1; i <= 1; i++) {
      enemyBullets.push({ x: x + i*4, y, w: 4, h: 10, vy: vyBase, vx: i * 0.05 });
    }
  } else {
    enemyBullets.push({ x, y, w: 4, h: 10, vy: vyBase, vx: 0 });
  }
}

function nextLevel() {
  // 過關獎金
  const clearBonus = 50 + level * 10;
  score += clearBonus;
  $('score').textContent = score;
  // 每 10 關 +1 命
  if (level % 10 === 0 && hp < 5) {
    hp++;
    $('hp').textContent = '❤'.repeat(hp);
    beep(880, 0.1, 'sine', 0.2);
    setTimeout(() => beep(1320, 0.18, 'sine', 0.2), 110);
  }
  level++;
  $('level').textContent = level;
  spawnLevel();
}

function hitPlayer() {
  combo = 0; $('combo').textContent = 0;
  hp--;
  $('hp').textContent = '❤'.repeat(Math.max(0, hp)) || '💀';
  spawnParticles(playerObj.x, playerObj.y, '#ff4d6d', 24);
  beep(180, 0.18, 'sawtooth', 0.2);
  if (hp <= 0) end();
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 0.1 + Math.random() * 0.4;
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 0.15,
      life: 400 + Math.random()*300, max: 600,
      color, size: 2 + Math.random()*3
    });
  }
}

// ===== 繪圖 =====
function drawStarfield(t) {
  // 簡單卷動星空
  if (!drawStarfield.stars) {
    drawStarfield.stars = [];
    for (let i = 0; i < 60; i++) {
      drawStarfield.stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*1.4 + 0.4, v: 0.02 + Math.random()*0.06 });
    }
  }
  for (const st of drawStarfield.stars) {
    st.y += st.v * 16;
    if (st.y > H) { st.y = 0; st.x = Math.random()*W; }
    ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + st.s*0.3).toFixed(2) + ')';
    ctx.fillRect(st.x, st.y, st.s, st.s);
  }
}

function drawBee(b) {
  const x = b.x, y = b.y;
  const s = b.size || 1;
  if (b.face && faceImgs[b.face] && faceImgs[b.face].complete && faceImgs[b.face].naturalWidth > 0) {
    // 小美女蜂 / BOSS：頭像 + 翅膀光環
    const R = 14 * s;
    ctx.save();
    if (b.isBoss) {
      // boss 多層光暈
      const pulse = 1 + Math.sin(performance.now()/150) * 0.08;
      ctx.beginPath();
      ctx.arc(x, y, R * 1.8 * pulse, 0, Math.PI*2);
      ctx.fillStyle = b.isTeacher ? 'rgba(255,212,0,0.18)' : 'rgba(255,93,166,0.18)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, R * 1.35, 0, Math.PI*2);
      ctx.fillStyle = b.isTeacher ? 'rgba(255,160,40,0.30)' : 'rgba(255,158,199,0.30)';
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(x, y, R + 4, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,158,199,0.35)';
      ctx.fill();
    }
    // 翅膀
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    const wf = b.isBoss ? Math.sin(performance.now()/40) * 0.4 + 0.6 : 1;
    ctx.beginPath(); ctx.ellipse(x - R, y - 3, R*0.6 * wf, R*0.35, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + R, y - 3, R*0.6 * wf, R*0.35,  0.4, 0, Math.PI*2); ctx.fill();
    // 頭像圓形
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, R, 0, Math.PI*2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(faceImgs[b.face], x-R, y-R, R*2, R*2);
    ctx.restore();
    // 邊框
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2);
    ctx.lineWidth = b.isBoss ? 3 : 2;
    ctx.strokeStyle = b.isTeacher ? '#ffd400' : (b.isBoss ? '#ff2a6d' : '#ff5da6');
    ctx.stroke();
    // 皇冠（boss = 大皇冠 / 老師 = 王冠+紅寶石）
    const cw = b.isBoss ? 1.5 * s : 1;
    ctx.fillStyle = b.isTeacher ? '#ffec4a' : '#ffd400';
    ctx.beginPath();
    ctx.moveTo(x - 8*cw, y - R);
    ctx.lineTo(x - 5*cw, y - R - 8*cw);
    ctx.lineTo(x - 2*cw, y - R);
    ctx.lineTo(x,        y - R - 6*cw);
    ctx.lineTo(x + 2*cw, y - R);
    ctx.lineTo(x + 5*cw, y - R - 8*cw);
    ctx.lineTo(x + 8*cw, y - R);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#a8731a'; ctx.lineWidth = 1; ctx.stroke();
    if (b.isTeacher) {
      // 老師王冠寶石
      ctx.fillStyle = '#e63946';
      ctx.beginPath(); ctx.arc(x, y - R - 4, 2.5, 0, Math.PI*2); ctx.fill();
    }
    // boss HP bar
    if (b.isBoss && b.hpMax > 1) {
      const bw = R * 2.4, bh = 6;
      const bx = x - bw/2, by = y - R - (b.isTeacher ? 22 : 16);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = '#333';
      ctx.fillRect(bx, by, bw, bh);
      const ratio = Math.max(0, b.hp / b.hpMax);
      ctx.fillStyle = ratio > 0.5 ? '#4ade80' : (ratio > 0.25 ? '#fbbf24' : '#ef4444');
      ctx.fillRect(bx, by, bw * ratio, bh);
    }
    ctx.restore();
    return;
  }
  // 普通蜜蜂
  ctx.save();
  // 翅膀（半透明）
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.beginPath(); ctx.ellipse(x-10, y-3, 7, 5, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+10, y-3, 7, 5,  0.5, 0, Math.PI*2); ctx.fill();
  // 身體
  ctx.fillStyle = '#ffd400';
  ctx.strokeStyle = '#3a2a08';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y, 11, 9, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // 條紋
  ctx.fillStyle = '#3a2a08';
  ctx.fillRect(x-7, y-2, 14, 2);
  ctx.fillRect(x-5, y+2, 10, 2);
  // 眼睛
  ctx.fillStyle = '#fff';
  ctx.fillRect(x-5, y-5, 3, 3);
  ctx.fillRect(x+2, y-5, 3, 3);
  ctx.fillStyle = '#000';
  ctx.fillRect(x-4, y-4, 1.5, 1.5);
  ctx.fillRect(x+3, y-4, 1.5, 1.5);
  // 觸鬚
  ctx.strokeStyle = '#3a2a08';
  ctx.beginPath();
  ctx.moveTo(x-3, y-8); ctx.lineTo(x-6, y-12);
  ctx.moveTo(x+3, y-8); ctx.lineTo(x+6, y-12);
  ctx.stroke();
  ctx.restore();
}

function drawPlayer() {
  const x = playerObj.x, y = playerObj.y;
  ctx.save();
  // 火焰
  ctx.fillStyle = '#ff7a1c';
  ctx.beginPath();
  ctx.moveTo(x-6, y+18);
  ctx.lineTo(x,   y+26 + Math.sin(performance.now()/40)*2);
  ctx.lineTo(x+6, y+18);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffd400';
  ctx.beginPath();
  ctx.moveTo(x-3, y+18);
  ctx.lineTo(x,   y+22 + Math.sin(performance.now()/40)*1.5);
  ctx.lineTo(x+3, y+18);
  ctx.closePath();
  ctx.fill();
  // 機身
  ctx.fillStyle = '#e8eef5';
  ctx.strokeStyle = '#2a3550';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y-22);          // 機鼻
  ctx.lineTo(x+18, y+8);        // 右翼
  ctx.lineTo(x+10, y+16);
  ctx.lineTo(x-10, y+16);
  ctx.lineTo(x-18, y+8);        // 左翼
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 駕駛艙圓窗 + 學號頭像
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y-2, 9, 0, Math.PI*2);
  ctx.closePath();
  ctx.clip();
  if (playerFaceLoaded) {
    ctx.drawImage(playerFaceImg, x-9, y-11, 18, 18);
  } else {
    ctx.fillStyle = '#9ec5ff';
    ctx.fillRect(x-9, y-11, 18, 18);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(x, y-2, 9, 0, Math.PI*2);
  ctx.lineWidth = 2; ctx.strokeStyle = '#ff9c1c';
  ctx.stroke();
  // 機翼末端紅點
  ctx.fillStyle = '#ff4d6d';
  ctx.fillRect(x-19, y+6, 4, 4);
  ctx.fillRect(x+15, y+6, 4, 4);
  ctx.restore();
}

function render() {
  ctx.clearRect(0,0,W,H);
  drawStarfield();
  // 蜜蜂
  for (const b of bees) if (b.alive) drawBee(b);
  // 玩家子彈
  ctx.fillStyle = '#fff';
  for (const b of bullets) {
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }
  // 敵彈
  ctx.fillStyle = '#ff5e5e';
  for (const b of enemyBullets) {
    ctx.fillRect(b.x-2, b.y, 4, 10);
  }
  drawPlayer();
  // 粒子
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // 編隊清光只剩 BOSS：頭上加閃動 ⚠ BOSS! 箭頭
  const aliveBees = bees.filter(b => b.alive);
  const onlyBoss = aliveBees.length === 1 && aliveBees[0].isBoss;
  if (onlyBoss) {
    const boss = aliveBees[0];
    const blink = (Math.sin(performance.now()/150) + 1) / 2;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 18px -apple-system, "PingFang TC", sans-serif';
    ctx.fillStyle = `rgba(255,80,80,${0.65 + blink*0.35})`;
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 4;
    const label = boss.isTeacher ? '⚠️ 老師大魔王！' : '⚠️ 打 BOSS！';
    ctx.strokeText(label, W/2, H - 90);
    ctx.fillText(label, W/2, H - 90);
    // 向上箭頭
    ctx.fillStyle = `rgba(255,200,40,${0.7 + blink*0.3})`;
    ctx.beginPath();
    ctx.moveTo(W/2, H - 110);
    ctx.lineTo(W/2 - 12, H - 90);
    ctx.lineTo(W/2 + 12, H - 90);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 關卡介紹覆蓋
  if (performance.now() < levelTransitionUntil) {
    const remain = levelTransitionUntil - performance.now();
    const alpha = Math.min(1, remain / 600);
    ctx.fillStyle = `rgba(0,0,0,${0.45 * alpha})`;
    ctx.fillRect(0, H/2 - 70, W, 140);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lines = transitionText.split('\n');
    ctx.font = 'bold 28px -apple-system, "PingFang TC", sans-serif';
    if (lines.length > 1) {
      ctx.font = 'bold 32px -apple-system, "PingFang TC", sans-serif';
      ctx.fillText(lines[0], W/2, H/2 - 20);
      ctx.font = 'bold 22px -apple-system, "PingFang TC", sans-serif';
      ctx.fillStyle = `rgba(255,93,108,${alpha})`;
      ctx.fillText(lines[1], W/2, H/2 + 18);
    } else {
      ctx.font = 'bold 36px -apple-system, "PingFang TC", sans-serif';
      ctx.fillText(transitionText, W/2, H/2);
    }
  }
}

function startGame() {
  setPlayerFaceSrc();
  preloadFaces();
  score = 0; combo = 0; hp = 3;
  $('score').textContent = 0;
  $('combo').textContent = 0;
  $('hp').textContent = '❤❤❤';
  bullets = []; enemyBullets = []; particles = [];
  playerObj.x = W/2;
  level = 1;
  $('level').textContent = level;
  spawnLevel();
  $('end-screen').classList.add('hidden');
  stage.classList.remove('paused');
  running = true;
  lastT = 0;
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  if (musicOn) startBgm();
  requestAnimationFrame(tick);
}

async function uploadScore() {
  const statusEl = $('upload-status');
  if (!firebaseReady) {
    statusEl.textContent = '⚠️ Firebase 未設定，分數沒上傳';
    statusEl.className = 'upload-status err';
    return;
  }
  if (!player) {
    statusEl.textContent = '（沒有學號，不上傳）';
    statusEl.className = 'upload-status';
    return;
  }
  if (score <= 0) {
    statusEl.textContent = '（0 分不上傳）';
    statusEl.className = 'upload-status';
    return;
  }
  statusEl.textContent = '⏳ 上傳分數中…';
  statusEl.className = 'upload-status';
  try {
    await addDoc(collection(db, SCORES_COLLECTION), {
      studentId: player.studentId,
      emoji: pickEmoji(player.studentId),
      score,
      difficulty,
      game: 'bee',
      createdAt: serverTimestamp(),
    });
    statusEl.textContent = '✅ 分數已上傳到排行榜';
    statusEl.className = 'upload-status ok';
  } catch (e) {
    console.error(e);
    statusEl.textContent = '❌ 上傳失敗：' + (e.message || e.code || '未知錯誤');
    statusEl.className = 'upload-status err';
  }
}

function end() {
  running = false;
  stopBgm();
  stage.classList.add('paused');
  beep(523, 0.12, 'sine', 0.18);
  setTimeout(() => beep(392, 0.18, 'sine', 0.16), 130);
  const newBest = score > best;
  if (newBest) {
    best = score;
    localStorage.setItem('bee_best', best);
  }
  $('best').textContent = best;
  $('end-best').textContent = best;
  $('final-score').textContent = score;
  $('new-best').style.display = newBest ? 'inline' : 'none';
  $('end-title').textContent = `飛機被擊落 💥（撐到第 ${level} 關）`;
  const endWho = $('end-who');
  if (player) {
    const photo = photoForStudent(player.studentId) || 'face-default.svg';
    endWho.innerHTML = `<img class="end-photo" src="${photo}" alt="${player.studentId}"><div>學號 ${player.studentId}・第 ${level} 關</div>`;
  } else {
    endWho.textContent = `第 ${level} 關`;
  }
  $('end-screen').classList.remove('hidden');
  uploadScore();
}

$('start').addEventListener('click', openGate);
$('restart').addEventListener('click', openGate);
$('sound').addEventListener('click', () => {
  soundOn = !soundOn;
  $('sound').textContent = soundOn ? '🔊 音效：開' : '🔇 音效：關';
});
$('music').addEventListener('click', () => {
  musicOn = !musicOn;
  $('music').textContent = musicOn ? '🎵 音樂：開' : '🎵 音樂：關';
  if (running) {
    if (musicOn) startBgm();
    else stopBgm();
  }
});

// 初始化頭像
setPlayerFaceSrc();
preloadFaces();
// 預先繪一張靜態畫面（讓畫布不是全黑）
level = 1;
spawnLevel();
levelTransitionUntil = 0; // 不要顯示開始文字
render();
</script>
